name: foundry-jfrog-poc
requiredVersions:
  azd: ">=1.37.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.22"
    azure.ai.projects: ">=1.0.0-beta.15"
infra:
  provider: microsoft.foundry
services:
  ai-project:
    host: azure.ai.project
    endpoint: "${FOUNDRY_PROJECT_ENDPOINT}"
  agent:
    host: azure.ai.agent
    project: .
    language: docker
    uses:
      - ai-project
    kind: hosted
    name: "${POC_AGENT_NAME}"
    description: Model-backed Responses POC using a verified prebuilt JFrog image.
    image: "${POC_IMAGE}"
    registryConnectionId: "${REGISTRY_CONNECTION_NAME}"
    docker:
      imagePassthrough: true
      remoteBuild: false
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: "${AZURE_AI_MODEL_DEPLOYMENT_NAME}"
      DEPLOYMENT_SOURCE: jfrog
      PYTHONNOUSERSITE: "1"
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
