schema: spec-driven

context: |
  This POC compares one model-backed Responses 2.0.0 agent deployed from ZIP,
  ACR, and directly from JFrog for developers and platform operators.
  APIM/MCP are excluded. Target Python 3.13 and Linux x86_64.
  agent/ owns runtime behavior; scripts/ owns packaging and operations;
  deploy/ owns azd configuration. Do not depend on another local checkout.
  Use approved Azure identity for model access and managed identity/OIDC for
  JFrog pulls. Keep publisher and runtime permissions separate. Never embed
  secrets or weaken TLS/network policy. Cloud targets and mutations require
  explicit operator approval. Reuse an existing project and model deployment.
  Require matching ZIP and local-container smoke evidence before ACR, then
  successful ACR evidence before JFrog. Compare immutable image content.
  Setup: python -m pip install -r requirements-dev.txt in a Python 3.13 venv.
  Tests: python -m unittest discover -s tests -p 'test_*.py'.
  Compile: python -m compileall -q agent scripts tests.
  OpenSpec: npx --yes @fission-ai/openspec@1.7.0 validate --all --strict --no-interactive.
  AGENTS.md defines review boundaries; README documents operational commands.
  GitHub issues define problems/ownership; accepted specs define behavior.
  Link issues and changes in PRs; never mark unavailable live checks passed.

rules:
  proposal:
    - Include the related GitHub issue when one exists
    - State user impact, scope, and explicit non-goals
    - Identify compatibility, migration, security, and operational impact
  specs:
    - Express observable behavior with testable scenarios
    - Cover important failure and edge cases
  design:
    - Document meaningful alternatives and tradeoffs
    - Identify rollout, rollback, telemetry, and data migration needs when relevant
  tasks:
    - Keep tasks ordered, independently verifiable, and small enough to review
    - Include tests, documentation, and operational work required by the change

operations:
  apply:
    guidance:
      - Keep tasks.md aligned with actual implementation progress
      - Validate the acceptance scenarios and report commands actually run
  archive:
    guidance:
      - Archive only after the implementation and resulting specifications are accepted
