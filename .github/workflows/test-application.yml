name: Test application

on:
  pull_request:
    paths:
      - "agent/**"
      - "scripts/**"
      - "tests/**"
      - "deploy/**"
      - "requirements-dev.*"
      - "Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/test-application.yml"
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - "scripts/**"
      - "tests/**"
      - "deploy/**"
      - "requirements-dev.*"
      - "Dockerfile"
      - ".dockerignore"
      - ".env.example"
      - ".github/workflows/test-application.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OTEL_SDK_DISABLED: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            agent/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Compile Python sources
        run: python -m compileall -q agent scripts tests

      - name: Check shell helpers
        run: bash -n scripts/publish.sh scripts/deploy_azd.sh
